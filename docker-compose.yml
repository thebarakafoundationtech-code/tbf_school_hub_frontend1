version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baraka-frontend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://schubapi.thebarakafoundation.or.tz/api/v1}
      - APP_URL=${APP_URL:-http://localhost:3000}
    env_file:
      - .env

