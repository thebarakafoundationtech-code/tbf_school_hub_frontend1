<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15223F" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0E1729" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D59A" />
      <stop offset="50%" stop-color="#D69B67" />
      <stop offset="100%" stop-color="#B87B44" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1729" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" filter="url(#shadow)" />

  <!-- Inner Subtle Shield Contour -->
  <path d="M256 80 L392 130 C392 270, 340 370, 256 424 C172 370, 120 270, 120 130 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.5" />

  <!-- Graduation Cap Icon Top Diamond -->
  <polygon points="256,150 380,210 256,268 132,210" fill="url(#goldGrad)" />

  <!-- Cap Crown Base -->
  <path d="M180 236 L180 300 C180 340, 332 340, 332 300 L332 236 L256 268 Z" fill="#D69B67" fill-opacity="0.85" />

  <!-- Cap Tassel Ribbon -->
  <path d="M344 220 L370 250 L370 310" fill="none" stroke="#F6D59A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="370" cy="315" r="7" fill="#F6D59A" />

  <!-- Star of Excellence at Shield Base -->
  <polygon points="256,346 262,364 282,364 266,376 272,394 256,382 240,394 246,376 230,364 250,364" fill="url(#goldGrad)" />

  <!-- Tanzanian Flag Accent Ribbon Underneath Badge -->
  <circle cx="410" cy="410" r="18" fill="#D69B67" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="410" cy="410" r="8" fill="#15223F" />
</svg>
