<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="tzFlag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1eb53a"/>
      <stop offset="35%" stop-color="#fcd116"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="65%" stop-color="#fcd116"/>
      <stop offset="100%" stop-color="#00a3dd"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D69B67"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#D69B67"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="12" fill="url(#bg)"/>

  <!-- Left Spine Shadow Effect for 3D Textbook Depth -->
  <rect x="0" y="0" width="16" height="420" fill="#000000" opacity="0.35"/>
  <line x1="16" y1="0" x2="16" y2="420" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Tanzania National Flag Stripe -->
  <rect x="16" y="0" width="284" height="7" fill="url(#tzFlag)"/>

  <!-- Official Top Header Banner -->
  <g opacity="0.9">
    <rect x="24" y="16" width="252" height="24" rx="4" fill="#000000" opacity="0.35"/>
    <text x="150" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#fde047" letter-spacing="1.5" text-anchor="middle">TANZANIA INSTITUTE OF EDUCATION</text>
  </g>

  <!-- Form Level Badge -->
  <g transform="translate(150, 68)" filter="url(#shadow)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">FORM 2</text>
  </g>

  <!-- Subject Subtitle -->
  <text x="150" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="1" text-anchor="middle">PHYSICS</text>

  <!-- Main Title Area -->
  <g filter="url(#shadow)">
    <text x="150" y="138" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">PHYSICS BOOK</text>
    <text x="150" y="160" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="17" font-weight="bold" fill="#fef08a" text-anchor="middle">2</text>
  </g>

  <!-- Subject Vector Graphic Symbol (Atom / Optics / Electricity) -->
  <g transform="translate(0, 5)">
    <ellipse cx="150" cy="220" rx="60" ry="22" fill="none" stroke="#f59e0b" stroke-width="3" transform="rotate(30 150 220)"/>
    <ellipse cx="150" cy="220" rx="60" ry="22" fill="none" stroke="#60a5fa" stroke-width="3" transform="rotate(-30 150 220)"/>
    <ellipse cx="150" cy="220" rx="60" ry="22" fill="none" stroke="#a78bfa" stroke-width="2" transform="rotate(90 150 220)"/>
    <circle cx="150" cy="220" r="14" fill="#fbbf24"/>
    <circle cx="150" cy="220" r="8" fill="#f59e0b"/>
  </g>

  <!-- Lower Details Container -->
  <g transform="translate(150, 310)">
    <rect x="-120" y="0" width="240" height="55" rx="10" fill="#000000" opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">TIE OFFICIAL REVISED 2025</text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Static &amp; Current Electricity · Magnetism</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Optics, Lenses &amp; Optical Instruments</text>
  </g>

  <!-- Bottom Gold Seal / MoEST stamp -->
  <g transform="translate(150, 395)">
    <rect x="-85" y="-12" width="170" height="20" rx="4" fill="url(#goldBanner)"/>
    <text x="0" y="2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="900" fill="#15223F" letter-spacing="0.5" text-anchor="middle">APPROVED FOR TANZANIA SCHOOLS</text>
  </g>
</svg>
